[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rawmem"
version = "0.7.0"
description = "A tiny local-first raw evidence ledger for AI and human workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liyuan" }]
keywords = ["ai", "memory", "ledger", "evidence", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
deepseek-harness = ["zstandard>=0.23"]
mcp = ["mcp>=1.2"]
all = ["mcp>=1.2", "zstandard>=0.23"]

[project.urls]
Homepage = "https://github.com/Liyuan1992/rawmem"
Repository = "https://github.com/Liyuan1992/rawmem"
Issues = "https://github.com/Liyuan1992/rawmem/issues"

[project.scripts]
rawmem = "rawmem.cli:main"
rawmem-mcp = "rawmem.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/rawmem" = [
  "PRIVACY.md",
  "README.md",
  "SECURITY.md",
  "docs/ARCHITECTURE.md",
  "docs/DEEPSEEK_HARNESS.md",
  "docs/LEDGER_PROTOCOL.md",
  "docs/RELEASE_CHECKLIST.md",
  "docs/SETUP.md",
]
"share/doc/rawmem/examples/deepseek-harness" = [
  "examples/deepseek-harness/rawmem.cordis.yml",
]
"share/doc/rawmem/releases" = ["docs/releases/0.7.0.md"]
